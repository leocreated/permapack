plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = project.maven_group
base { archivesName = 'permapack' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE') { rename { "LICENSE_permapack" } } }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'permapack-tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
